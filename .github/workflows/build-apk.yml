name: Compilar APK AXION Remote

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permissão de execução ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK com Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Salvar APK como Artefato de Download
        uses: actions/upload-artifact@v4
        with:
          name: axion-remote-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
